<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Little Doug Voxel Adventure</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #38bdf8;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            outline: none;
        }
        /* HUD UI Overlay */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(13, 20, 32, 0.85);
            padding: 16px 20px;
            border-radius: 14px;
            border: 1px solid rgba(76, 175, 80, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            min-width: 240px;
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        h1 {
            font-size: 15px;
            margin: 0 0 10px 0;
            color: #4ade80;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin: 5px 0;
            color: #cbd5e1;
        }
        .stat-val {
            font-weight: bold;
            color: #38bdf8;
        }

        /* Autonomous Telemetry Panel */
        #telemetry {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(13, 20, 32, 0.85);
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-size: 11px;
            min-width: 220px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 10;
            pointer-events: none;
        }
        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* Mobile D-Pad Controls */
        #dpad {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 140px;
            height: 140px;
            z-index: 20;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
        }
        .dbtn {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.1s, transform 0.05s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .dbtn:active {
            background: rgba(76, 175, 80, 0.7);
            transform: scale(0.95);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        #controls-hint {
            position: absolute;
            bottom: 25px;
            right: 25px;
            background: rgba(13, 20, 32, 0.8);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 11px;
            color: #94a3b8;
            pointer-events: none;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Toast Popup */
        #toast {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(13, 20, 32, 0.95);
            border: 1px solid rgba(76, 175, 80, 0.6);
            color: white;
            padding: 14px 28px;
            border-radius: 18px;
            font-weight: normal;
            font-size: 13px;
            line-height: 1.4;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 30;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 80vw;
            text-align: center;
            backdrop-filter: blur(8px);
        }
        #toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        #toast-title {
            color: #4ade80;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 4px;
        }
        #toast-lore {
            color: #cbd5e1;
            font-style: italic;
        }
    </style>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
</head>
<body>

    <div id="canvas-container" tabindex="0"></div>

    <!-- HUD Overlay -->
    <div id="hud">
        <h1><span>🎒</span> Little Doug Explorer</h1>
        <div class="stat-row"><span>Chunk Position:</span><span id="chunk-coord" class="stat-val">[0, 0]</span></div>
        <div class="stat-row"><span>Current Biome:</span><span id="biome-name" class="stat-val">Loading...</span></div>
        <div class="stat-row"><span>Specimens Collected:</span><span id="score" class="stat-val">0</span></div>
        <div class="stat-row"><span>Engine FPS:</span><span id="fps-val" class="stat-val">60</span></div>
    </div>

    <!-- Telemetry -->
    <div id="telemetry">
        <div style="margin-bottom: 6px;"><span class="pulse"></span> <strong style="color: #4ade80;">Voxel Engine Active</strong></div>
        <div class="stat-row"><span>Active Chunks:</span><span id="diag-chunks" style="color: #38bdf8;">0</span></div>
        <div class="stat-row"><span>Active Specimens:</span><span id="diag-specs" style="color: #38bdf8;">0</span></div>
        <div class="stat-row"><span>Memory Heap:</span><span id="diag-mem" style="color: #22c55e;">--</span></div>
    </div>

    <!-- Controls -->
    <div id="dpad">
        <div class="dbtn" id="btn-up">▲</div>
        <div class="dbtn" id="btn-left">◀</div>
        <div class="dbtn" id="btn-right">▶</div>
        <div class="dbtn" id="btn-down">▼</div>
    </div>

    <div id="controls-hint">
        Use <strong>WASD / Arrows</strong> to navigate | <strong>Click & Drag</strong> camera
    </div>

    <div id="toast">
        <div id="toast-title">Specimen Collected!</div>
        <div id="toast-lore"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

        // --- DIAGNOSTIC TELEMETRY ---
        const Diagnostics = {
            fps: 60,
            frameCount: 0,
            lastTime: performance.now(),
            logs: [],
            record(level, category, message) {
                const entry = `[${new Date().toISOString()}] [${level}] [${category}] ${message}`;
                this.logs.push(entry);
                if (this.logs.length > 100) this.logs.shift();
            },
            async flush() {
                try {
                    const payload = {
                        timestamp: new Date().toISOString(),
                        fps: this.fps,
                        activeChunks: activeChunkMeshes.size,
                        loadedChunksCache: loadedChunks.size,
                        activeSpecimens: activeSpecimens.length,
                        memoryHeapMB: performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : "N/A",
                        playerCoords: [Math.floor((dougGroup.position.x + 8) / 16), Math.floor((dougGroup.position.z + 8) / 16)],
                        recentLogs: this.logs.slice(-20)
                    };
                    await fetch('/api/log', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload, null, 2)
                    });
                } catch (e) {}
            }
        };

        setInterval(() => Diagnostics.flush(), 3000);

        const container = document.getElementById('canvas-container');
        window.addEventListener('load', () => { container.focus(); });
        window.addEventListener('click', () => { container.focus(); });

        // --- SCENE SETUP WITH MINECRAFT FOG & LIGHTING ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x78a7ff);
        scene.fog = new THREE.FogExp2(0x78a7ff, 0.011);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 14, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 45;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.1);
        sunLight.position.set(40, 60, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 120;
        sunLight.shadow.camera.left = -35;
        sunLight.shadow.camera.right = 35;
        sunLight.shadow.camera.top = 35;
        sunLight.shadow.camera.bottom = -35;
        scene.add(sunLight);

        // --- PROCEDURAL PIXEL-ART MINECRAFT TEXTURE GENERATOR ---
        function createMinecraftTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');

            let baseHex = '#78350f';
            let noiseIntensity = 0.15;

            if (type === 'grass') {
                baseHex = '#22c55e';
                noiseIntensity = 0.2;
            } else if (type === 'dirt') {
                baseHex = '#78350f';
                noiseIntensity = 0.18;
            } else if (type === 'stone') {
                baseHex = '#64748b';
                noiseIntensity = 0.14;
            } else if (type === 'sand') {
                baseHex = '#eab308';
                noiseIntensity = 0.12;
            } else if (type === 'snow') {
                baseHex = '#f8fafc';
                noiseIntensity = 0.06;
            } else if (type === 'water') {
                baseHex = '#0284c7';
                noiseIntensity = 0.1;
            } else if (type === 'wood') {
                baseHex = '#5c4033';
                noiseIntensity = 0.12;
            } else if (type === 'leaves_green') {
                baseHex = '#15803d';
                noiseIntensity = 0.18;
            } else if (type === 'leaves_snow') {
                baseHex = '#cbd5e1';
                noiseIntensity = 0.12;
            } else if (type === 'cactus') {
                baseHex = '#166534';
                noiseIntensity = 0.1;
            }

            const color = new THREE.Color(baseHex);
            const r = Math.floor(color.r * 255);
            const g = Math.floor(color.g * 255);
            const b = Math.floor(color.b * 255);

            for (let x = 0; x < 16; x++) {
                for (let y = 0; y < 16; y++) {
                    const noise = (Math.random() - 0.5) * noiseIntensity;
                    const nr = Math.min(255, Math.max(0, Math.floor(r * (1 + noise))));
                    const ng = Math.min(255, Math.max(0, Math.floor(g * (1 + noise))));
                    const nb = Math.min(255, Math.max(0, Math.floor(b * (1 + noise))));
                    ctx.fillStyle = `rgb(${nr},${ng},${nb})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }

            ctx.fillStyle = 'rgba(0,0,0,0.12)';
            ctx.fillRect(0, 15, 16, 1);
            ctx.fillRect(15, 0, 1, 16);
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.fillRect(0, 0, 16, 1);
            ctx.fillRect(0, 0, 1, 16);

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        const materials = {
            grass: new THREE.MeshStandardMaterial({ map: createMinecraftTexture('grass'), roughness: 0.8 }),
            dirt: new THREE.MeshStandardMaterial({ map: createMinecraftTexture('dirt'), roughness: 0.9 }),
            stone: new THREE.MeshStandardMaterial({ map: createMinecraftTexture('stone'), roughness: 0.7 }),
            sand: new THREE.MeshStandardMaterial({ map: createMinecraftTexture('sand'), roughness: 0.85 }),
            snow: new THREE.MeshStandardMaterial({ map: createMinecraftTexture('snow'), roughness: 0.6 }),
            water: new THREE.MeshStandardMaterial({ map: createMinecraftTexture('water'), roughness: 0.3, transparent: true, opacity: 0.85 }),
            wood: new THREE.MeshStandardMaterial({ map: createMinecraftTexture('wood'), roughness: 0.8 }),
            leaves_green: new THREE.MeshStandardMaterial({ map: createMinecraftTexture('leaves_green'), roughness: 0.7 }),
            leaves_snow: new THREE.MeshStandardMaterial({ map: createMinecraftTexture('leaves_snow'), roughness: 0.7 }),
            cactus: new THREE.MeshStandardMaterial({ map: createMinecraftTexture('cactus'), roughness: 0.75 })
        };

        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const specimenGeo = new THREE.OctahedronGeometry(0.35);
        const specimenMat = new THREE.MeshStandardMaterial({
            color: 0x38bdf8,
            emissive: 0x0284c7,
            emissiveIntensity: 0.8,
            roughness: 0.1,
            metalness: 0.3
        });

        function pseudoNoise(x, z) {
            return (Math.sin(x * 0.2) * Math.cos(z * 0.2) * 2.5 +
                    Math.sin(x * 0.05 + z * 0.05) * 4.0 +
                    Math.cos(x * 0.4) * 0.8);
        }

        // --- CLOUDS ---
        const cloudGroup = new THREE.Group();
        scene.add(cloudGroup);
        const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });

        for (let i = 0; i < 18; i++) {
            const cluster = new THREE.Group();
            for (let j = 0; j < 4; j++) {
                const cube = new THREE.Mesh(boxGeo, cloudMat);
                cube.scale.set(Math.random() * 3 + 2, 0.8, Math.random() * 3 + 2);
                cube.position.set((Math.random() - 0.5) * 6, 0, (Math.random() - 0.5) * 6);
                cluster.add(cube);
            }
            cluster.position.set((Math.random() - 0.5) * 220, Math.random() * 8 + 32, (Math.random() - 0.5) * 220);
            cloudGroup.add(cluster);
        }

        function getBlockMaterialKey(biomeType, h, y) {
            const biome = (biomeType || "").toLowerCase();
            if (biome.includes('river') || biome.includes('lake') || biome.includes('wetland')) {
                return h <= 1 ? 'water' : 'sand';
            }
            if (biome.includes('desert')) {
                return 'sand';
            }
            if (biome.includes('snow')) {
                return h > 4 ? 'snow' : 'stone';
            }
            if (y === h) {
                return 'grass';
            }
            if (y >= h - 1 && h >= 3) {
                return 'dirt';
            }
            return 'stone';
        }

        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        const loadedChunks = new Map();
        const activeChunkMeshes = new Map();
        const activeSpecimens = [];
        let score = 0;
        let currentChunk = [999, 999];
        let toastTimeout = null;

        function getProceduralBiome(cx, cz) {
            const biomes = ["lush_riverbank", "snowy_mountain", "desert_dunes", "slate_ridge", "flower_meadow"];
            return biomes[Math.abs((cx * 73 + cz * 37)) % biomes.length];
        }

        function generateProceduralFallbackChunk(cx, cz) {
            const key = `${cx},${cz}`;
            if (loadedChunks.has(key)) return loadedChunks.get(key);

            const biomeType = getProceduralBiome(cx, cz);
            const grid = [];
            for (let z = 0; z < 16; z++) {
                const row = [];
                for (let x = 0; x < 16; x++) {
                    let n = pseudoNoise(cx * 16 + (x - 7.5), cz * 16 + (z - 7.5));
                    let h = Math.max(1, Math.floor(n + 2.5));
                    if (biomeType === "snowy_mountain") h += 2;
                    row.push(h);
                }
                grid.push(row);
            }

            const fallback = { biome_type: biomeType, elevation_grid: grid, specimens: [] };
            loadedChunks.set(key, fallback);
            return fallback;
        }

        async function fetchChunk(cx, cz) {
            const key = `${cx},${cz}`;
            if (loadedChunks.has(key)) return loadedChunks.get(key);

            if (Math.abs(cx) > 8 || Math.abs(cz) > 8) {
                return generateProceduralFallbackChunk(cx, cz);
            }

            try {
                const response = await fetch(`chunks/chunk_${cx}_${cz}.json`);
                if (!response.ok) throw new Error();
                const data = await response.json();
                loadedChunks.set(key, data);
                return data;
            } catch (err) {
                return generateProceduralFallbackChunk(cx, cz);
            }
        }

        function getTerrainHeight(worldX, worldZ) {
            const cx = Math.floor((worldX + 8) / 16);
            const cz = Math.floor((worldZ + 8) / 16);
            const chunkData = loadedChunks.get(`${cx},${cz}`);
            if (!chunkData || !chunkData.elevation_grid) return 0;
            const lx = Math.round(worldX - (cx * 16) + 7.5);
            const lz = Math.round(worldZ - (cz * 16) + 7.5);
            return (chunkData.elevation_grid[lz] && chunkData.elevation_grid[lz][lx]) || 0;
        }

        // --- BIOME-ALIGNED FLORA GENERATOR ---
        function addBiomeFlora(x, z, h, biomeType, geometriesByMaterial) {
            const biome = (biomeType || "").toLowerCase();

            // Cactus in Deserts
            if (biome.includes('desert') && Math.random() < 0.04) {
                const cactusHeight = Math.floor(Math.random() * 2) + 2;
                for (let cy = 1; cy <= cactusHeight; cy++) {
                    const geom = boxGeo.clone();
                    geom.translate(x - 7.5, h + cy, z - 7.5);
                    if (!geometriesByMaterial['cactus']) geometriesByMaterial['cactus'] = [];
                    geometriesByMaterial['cactus'].push(geom);
                }
                return;
            }

            // Pine Trees in Snowy Mountains
            if (biome.includes('snow') && Math.random() < 0.035) {
                const trunkHeight = 3;
                for (let ty = 1; ty <= trunkHeight; ty++) {
                    const geom = boxGeo.clone();
                    geom.translate(x - 7.5, h + ty, z - 7.5);
                    if (!geometriesByMaterial['wood']) geometriesByMaterial['wood'] = [];
                    geometriesByMaterial['wood'].push(geom);
                }
                // Snowy pine foliage layers
                for (let ly = trunkHeight; ly <= trunkHeight + 2; ly++) {
                    const radius = ly === trunkHeight + 2 ? 1 : 2;
                    for (let fx = -radius; fx <= radius; fx++) {
                        for (let fz = -radius; fz <= radius; fz++) {
                            if (Math.abs(fx) === radius && Math.abs(fz) === radius && ly === trunkHeight + 2) continue;
                            const geom = boxGeo.clone();
                            geom.translate(x - 7.5 + fx, h + ly, z - 7.5 + fz);
                            if (!geometriesByMaterial['leaves_snow']) geometriesByMaterial['leaves_snow'] = [];
                            geometriesByMaterial['leaves_snow'].push(geom);
                        }
                    }
                }
                return;
            }

            // Leafy Deciduous Trees in Lush / Meadows
            if ((biome.includes('lush') || biome.includes('flower') || biome.includes('slate')) && Math.random() < 0.04) {
                const trunkHeight = Math.floor(Math.random() * 2) + 3;
                for (let ty = 1; ty <= trunkHeight; ty++) {
                    const geom = boxGeo.clone();
                    geom.translate(x - 7.5, h + ty, z - 7.5);
                    if (!geometriesByMaterial['wood']) geometriesByMaterial['wood'] = [];
                    geometriesByMaterial['wood'].push(geom);
                }
                // Deciduous canopy
                for (let lx = -1; lx <= 1; lx++) {
                    for (let lz = -1; lz <= 1; lz++) {
                        for (let ly = 0; ly < 2; ly++) {
                            if (Math.abs(lx) === 1 && Math.abs(lz) === 1 && ly === 1) continue;
                            const geom = boxGeo.clone();
                            geom.translate(x - 7.5 + lx, h + trunkHeight + ly, z - 7.5 + lz);
                            if (!geometriesByMaterial['leaves_green']) geometriesByMaterial['leaves_green'] = [];
                            geometriesByMaterial['leaves_green'].push(geom);
                        }
                    }
                }
            }
        }

        // --- MERGED TEXTURED VOXEL CHUNK RENDERER ---
        function renderChunk(cx, cz, chunkData) {
            const key = `${cx},${cz}`;
            if (activeChunkMeshes.has(key)) return;

            const chunkGroup = new THREE.Group();
            chunkGroup.position.set(cx * 16, 0, cz * 16);
            const grid = chunkData.elevation_grid || Array(16).fill().map(() => Array(16).fill(1));
            const biomeType = chunkData.biome_type || "forest";

            const geometriesByMaterial = {};

            for (let x = 0; x < 16; x++) {
                for (let z = 0; z < 16; z++) {
                    const h = grid[z][x];
                    for (let y = 0; y <= h; y++) {
                        const matKey = getBlockMaterialKey(biomeType, h, y);
                        
                        const geom = boxGeo.clone();
                        geom.translate(x - 7.5, y, z - 7.5);

                        if (!geometriesByMaterial[matKey]) geometriesByMaterial[matKey] = [];
                        geometriesByMaterial[matKey].push(geom);
                    }

                    // Add biome-aligned flora on top surface blocks
                    if (h >= 2) {
                        addBiomeFlora(x, z, h, biomeType, geometriesByMaterial);
                    }
                }
            }

            // Merge geometries per material type
            for (const matKey in geometriesByMaterial) {
                const mergedGeom = mergeGeometries(geometriesByMaterial[matKey]);
                if (mergedGeom) {
                    const mesh = new THREE.Mesh(mergedGeom, materials[matKey]);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    chunkGroup.add(mesh);
                }
            }

            if (chunkData.specimens) {
                chunkData.specimens.forEach(spec => {
                    const specimenMesh = new THREE.Mesh(specimenGeo, specimenMat);
                    const groundH = getTerrainHeight((cx * 16) + spec.x, (cz * 16) + spec.y);
                    specimenMesh.position.set(spec.x, groundH + 0.9, spec.y);
                    specimenMesh.userData = { 
                        name: spec.name, 
                        lore: spec.lore || "", 
                        collected: false, 
                        chunkKey: key, 
                        baseY: groundH + 0.9 
                    };
                    chunkGroup.add(specimenMesh);
                    activeSpecimens.push(specimenMesh);
                });
            }

            worldGroup.add(chunkGroup);
            activeChunkMeshes.set(key, chunkGroup);
            Diagnostics.record("INFO", "ChunkEngine", `Rendered textured chunk with flora [${cx}, ${cz}]`);
        }

        const RENDER_DISTANCE = 2;
        function cullDistantChunks(playerCx, playerCz) {
            activeChunkMeshes.forEach((chunkGroup, key) => {
                const [cx, cz] = key.split(',').map(Number);
                if (Math.abs(cx - playerCx) > RENDER_DISTANCE || Math.abs(cz - playerCz) > RENDER_DISTANCE) {
                    scene.remove(chunkGroup);
                    chunkGroup.traverse((child) => {
                        if (child.isMesh && child.geometry) {
                            child.geometry.dispose();
                        }
                    });
                    for (let i = activeSpecimens.length - 1; i >= 0; i--) {
                        if (activeSpecimens[i].userData.chunkKey === key) activeSpecimens.splice(i, 1);
                    }
                    activeChunkMeshes.delete(key);
                    loadedChunks.delete(key);
                    Diagnostics.record("INFO", "MemoryManager", `Culled chunk [${cx}, ${cz}]`);
                }
            });
        }

        // --- ENHANCED VOXEL LITTLE DOUG MASCOT MODEL ---
        function createVoxelLittleDoug() {
            const group = new THREE.Group();

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffd1a4, roughness: 0.6 });
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x4a2e12, roughness: 0.8 });
            const jacketMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.5 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
            const shortsMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.6 });
            const bootMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.9 });
            const hatMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.5 });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });

            const torso = new THREE.Mesh(boxGeo, jacketMat);
            torso.scale.set(0.7, 0.75, 0.45);
            torso.position.y = 0.725;
            torso.castShadow = true;
            group.add(torso);

            const shirtInner = new THREE.Mesh(boxGeo, shirtMat);
            shirtInner.scale.set(0.3, 0.7, 0.46);
            shirtInner.position.set(0, 0.725, 0.01);
            group.add(shirtInner);

            const head = new THREE.Mesh(boxGeo, skinMat);
            head.scale.set(0.55, 0.55, 0.55);
            head.position.y = 1.35;
            head.castShadow = true;
            group.add(head);

            const eyeL = new THREE.Mesh(boxGeo, eyeMat);
            eyeL.scale.set(0.08, 0.12, 0.05);
            eyeL.position.set(-0.14, 1.4, 0.28);
            group.add(eyeL);

            const eyeR = eyeL.clone();
            eyeR.position.x = 0.14;
            group.add(eyeR);

            const hairTop = new THREE.Mesh(boxGeo, hairMat);
            hairTop.scale.set(0.57, 0.12, 0.57);
            hairTop.position.set(0, 1.62, -0.02);
            group.add(hairTop);

            const capCrown = new THREE.Mesh(boxGeo, hatMat);
            capCrown.scale.set(0.58, 0.18, 0.58);
            capCrown.position.set(0, 1.68, -0.02);
            capCrown.castShadow = true;
            group.add(capCrown);

            const capBrim = new THREE.Mesh(boxGeo, hatMat);
            capBrim.scale.set(0.62, 0.05, 0.28);
            capBrim.position.set(0, 1.62, 0.28);
            capBrim.castShadow = true;
            group.add(capBrim);

            const armL = new THREE.Group();
            const sleeveL = new THREE.Mesh(boxGeo, jacketMat);
            sleeveL.scale.set(0.2, 0.35, 0.2);
            sleeveL.position.y = -0.175;
            sleeveL.castShadow = true;
            armL.add(sleeveL);

            const handL = new THREE.Mesh(boxGeo, skinMat);
            handL.scale.set(0.18, 0.3, 0.18);
            handL.position.y = -0.45;
            handL.castShadow = true;
            armL.add(handL);

            armL.position.set(-0.48, 1.0, 0);
            group.add(armL);

            const armR = armL.clone();
            armR.position.x = 0.48;
            group.add(armR);

            const legL = new THREE.Group();
            const shortL = new THREE.Mesh(boxGeo, shortsMat);
            shortL.scale.set(0.24, 0.25, 0.24);
            shortL.position.y = -0.125;
            shortL.castShadow = true;
            legL.add(shortL);

            const bootL = new THREE.Mesh(boxGeo, bootMat);
            bootL.scale.set(0.22, 0.25, 0.28);
            bootL.position.set(0, -0.325, 0.02);
            bootL.castShadow = true;
            legL.add(bootL);

            legL.position.set(-0.18, 0.35, 0);
            group.add(legL);

            const legR = legL.clone();
            legR.position.x = 0.18;
            group.add(legR);

            group.userData = { armL, armR, legL, legR };
            return group;
        }

        const dougGroup = createVoxelLittleDoug();
        scene.add(dougGroup);

        const moveState = { up: false, down: false, left: false, right: false };
        window.addEventListener('keydown', (e) => handleKey(e.code, true));
        window.addEventListener('keyup', (e) => handleKey(e.code, false));
        function handleKey(code, isDown) {
            if (code === 'KeyW' || code === 'ArrowUp') moveState.up = isDown;
            if (code === 'KeyS' || code === 'ArrowDown') moveState.down = isDown;
            if (code === 'KeyA' || code === 'ArrowLeft') moveState.left = isDown;
            if (code === 'KeyD' || code === 'ArrowRight') moveState.right = isDown;
        }

        ['up', 'down', 'left', 'right'].forEach(dir => {
            const btn = document.getElementById(`btn-${dir}`);
            if (btn) {
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); moveState[dir] = true; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); moveState[dir] = false; });
                btn.addEventListener('mousedown', () => moveState[dir] = true);
                btn.addEventListener('mouseup', () => moveState[dir] = false);
            }
        });

        function showToast(title, lore = "") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-lore').innerText = lore ? `"${lore}"` : "";
            
            toast.classList.add('show');
            
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 5000); // Popup stays up for 5 seconds
        }

        let walkCycleTime = 0;

        async function updatePlayer() {
            const speed = 0.14;
            let moveX = 0, moveZ = 0;
            if (moveState.up) moveZ -= speed;
            if (moveState.down) moveZ += speed;
            if (moveState.left) moveX -= speed;
            if (moveState.right) moveX += speed;

            const isMoving = (moveX !== 0 || moveZ !== 0);
            if (isMoving) {
                dougGroup.position.x += moveX;
                dougGroup.position.z += moveZ;
                
                const targetAngle = Math.atan2(moveX, moveZ);
                dougGroup.rotation.y = THREE.MathUtils.lerp(dougGroup.rotation.y, targetAngle, 0.25);
                
                camera.position.x += moveX;
                camera.position.z += moveZ;

                walkCycleTime += 0.28;
                const swing = Math.sin(walkCycleTime) * 0.6;
                dougGroup.userData.legL.rotation.x = swing;
                dougGroup.userData.legR.rotation.x = -swing;
                dougGroup.userData.armL.rotation.x = -swing;
                dougGroup.userData.armR.rotation.x = swing;
            } else {
                dougGroup.userData.legL.rotation.x = THREE.MathUtils.lerp(dougGroup.userData.legL.rotation.x, 0, 0.2);
                dougGroup.userData.legR.rotation.x = THREE.MathUtils.lerp(dougGroup.userData.legR.rotation.x, 0, 0.2);
                dougGroup.userData.armL.rotation.x = THREE.MathUtils.lerp(dougGroup.userData.armL.rotation.x, 0, 0.2);
                dougGroup.userData.armR.rotation.x = THREE.MathUtils.lerp(dougGroup.userData.armR.rotation.x, 0, 0.2);
            }

            const groundHeight = getTerrainHeight(dougGroup.position.x, dougGroup.position.z);
            const bounce = isMoving ? Math.abs(Math.sin(walkCycleTime)) * 0.08 : 0;
            
            dougGroup.position.y = groundHeight + 0.45 + bounce;
            controls.target.set(dougGroup.position.x, groundHeight + 1.1, dougGroup.position.z);

            const cx = Math.floor((dougGroup.position.x + 8) / 16);
            const cz = Math.floor((dougGroup.position.z + 8) / 16);

            if (cx !== currentChunk[0] || cz !== currentChunk[1]) {
                currentChunk = [cx, cz];
                document.getElementById('chunk-coord').innerText = `[${cx}, ${cz}]`;
                
                // Update Biome HUD Name dynamically
                const currentChunkKey = `${cx},${cz}`;
                const activeChunkData = loadedChunks.get(currentChunkKey);
                if (activeChunkData && activeChunkData.biome_type) {
                    let formattedBiome = activeChunkData.biome_type
                        .split('_')
                        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                        .join(' ');
                    document.getElementById('biome-name').innerText = formattedBiome;
                } else {
                    document.getElementById('biome-name').innerText = "Wilderness";
                }

                cullDistantChunks(cx, cz);

                for (let dx = -RENDER_DISTANCE; dx <= RENDER_DISTANCE; dx++) {
                    for (let dz = -RENDER_DISTANCE; dz <= RENDER_DISTANCE; dz++) {
                        const chunkData = await fetchChunk(cx + dx, cz + dz);
                        renderChunk(cx + dx, cz + dz, chunkData);
                    }
                }
            }

            const time = Date.now() * 0.003;
            activeSpecimens.forEach(spec => {
                if (!spec.userData.collected) {
                    spec.rotation.y += 0.04;
                    spec.position.y = spec.userData.baseY + Math.sin(time + spec.position.x) * 0.15;

                    const worldPos = new THREE.Vector3();
                    spec.getWorldPosition(worldPos);

                    if (dougGroup.position.distanceTo(worldPos) < 1.1) {
                        spec.userData.collected = true;
                        spec.parent.remove(spec);
                        score++;
                        document.getElementById('score').innerText = score;
                        showToast(`✨ Collected: ${spec.userData.name}`, spec.userData.lore);
                    }
                }
            });

            document.getElementById('diag-chunks').innerText = activeChunkMeshes.size;
            document.getElementById('diag-specs').innerText = activeSpecimens.length;
            if (performance.memory) {
                document.getElementById('diag-mem').innerText = Math.round(performance.memory.usedJSHeapSize / 1048576) + " MB";
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            Diagnostics.frameCount++;
            if (now - Diagnostics.lastTime >= 1000) {
                Diagnostics.fps = Math.round((Diagnostics.frameCount * 1000) / (now - Diagnostics.lastTime));
                document.getElementById('fps-val').innerText = Diagnostics.fps;
                Diagnostics.frameCount = 0;
                Diagnostics.lastTime = now;
            }

            updatePlayer();
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
