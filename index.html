<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Little Doug Voxel Adventure</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #38bdf8;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            outline: none;
        }
        /* HUD UI Overlay */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(13, 20, 32, 0.85);
            padding: 16px 20px;
            border-radius: 14px;
            border: 1px solid rgba(76, 175, 80, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            min-width: 240px;
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        h1 {
            font-size: 15px;
            margin: 0 0 10px 0;
            color: #4ade80;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin: 5px 0;
            color: #cbd5e1;
        }
        .stat-val {
            font-weight: bold;
            color: #38bdf8;
        }

        /* Autonomous Telemetry Panel */
        #telemetry {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(13, 20, 32, 0.85);
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-size: 11px;
            min-width: 220px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 10;
            pointer-events: none;
        }
        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* Mobile D-Pad Controls */
        #dpad {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 140px;
            height: 140px;
            z-index: 20;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
        }
        .dbtn {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.1s, transform 0.05s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .dbtn:active {
            background: rgba(76, 175, 80, 0.7);
            transform: scale(0.95);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        #controls-hint {
            position: absolute;
            bottom: 25px;
            right: 25px;
            background: rgba(13, 20, 32, 0.8);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 11px;
            color: #94a3b8;
            pointer-events: none;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Toast Popup */
        #toast {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(16, 185, 129, 0.95);
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 30;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            letter-spacing: 0.5px;
        }
        #toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>

    <!-- Import Map for Modern Three.js & OrbitControls -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
</head>
<body>

    <div id="canvas-container" tabindex="0"></div>

    <!-- HUD -->
    <div id="hud">
        <h1><span>🌲</span> Voxel Little Doug</h1>
        <div class="stat-row"><span>Chunk Coordinate:</span><span id="chunk-coord" class="stat-val">[0, 0]</span></div>
        <div class="stat-row"><span>Current Biome:</span><span id="biome-name" class="stat-val">Loading...</span></div>
        <div class="stat-row"><span>Specimens Collected:</span><span id="score" class="stat-val">0</span></div>
    </div>

    <!-- Telemetry -->
    <div id="telemetry">
        <div style="margin-bottom: 6px;"><span class="pulse"></span> <strong style="color: #4ade80;">Pipeline Active</strong></div>
        <div class="stat-row"><span>Raspberry Pi Node:</span><span style="color: #22c55e;">Polling [OK]</span></div>
        <div class="stat-row"><span>Workstation Llama:</span><span style="color: #38bdf8;">Standby</span></div>
        <div class="stat-row"><span>Chunk Engine:</span><span style="color:#f59e0b;">Streaming</span></div>
    </div>

    <!-- On-screen Controls -->
    <div id="dpad">
        <div class="dbtn" id="btn-up">▲</div>
        <div class="dbtn" id="btn-left">◀</div>
        <div class="dbtn" id="btn-right">▶</div>
        <div class="dbtn" id="btn-down">▼</div>
    </div>

    <div id="controls-hint">
        Use <strong>WASD / Arrows</strong> to move | <strong>Click & Drag</strong> to rotate camera
    </div>

    <div id="toast">Specimen Collected!</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('canvas-container');
        window.addEventListener('load', () => { container.focus(); });
        window.addEventListener('click', () => { container.focus(); });

        // --- 3D SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x38bdf8);
        scene.fog = new THREE.FogExp2(0x38bdf8, 0.012);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- ORBIT CONTROLS ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Keep camera above ground level
        controls.minDistance = 5;
        controls.maxDistance = 40;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5ea, 1.0);
        dirLight.position.set(25, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        scene.add(dirLight);

        // Base Box Geometry
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);

        // Dynamic Procedural Height Generator (Simplex Noise Simulation)
        function pseudoNoise(x, z) {
            return (Math.sin(x * 0.2) * Math.cos(z * 0.2) * 2.5 +
                    Math.sin(x * 0.05 + z * 0.05) * 4.0 +
                    Math.cos(x * 0.4) * 0.8);
        }

        // --- VOXEL CLOUD SYSTEM ---
        const cloudGroup = new THREE.Group();
        scene.add(cloudGroup);

        const cloudMat = new THREE.MeshLambertMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.85
        });

        for (let i = 0; i < 20; i++) {
            const cluster = new THREE.Group();
            const clusterSize = Math.floor(Math.random() * 5) + 3;

            for (let j = 0; j < clusterSize; j++) {
                const cloudCube = new THREE.Mesh(boxGeo, cloudMat);
                cloudCube.position.set(
                    (Math.random() - 0.5) * 7,
                    (Math.random() - 0.5) * 1.5,
                    (Math.random() - 0.5) * 5
                );
                cloudCube.scale.set(
                    Math.random() * 2.5 + 2.0,
                    Math.random() * 0.8 + 0.8,
                    Math.random() * 2.5 + 2.0
                );
                cluster.add(cloudCube);
            }

            cluster.position.set(
                (Math.random() - 0.5) * 220,
                Math.random() * 12 + 32,
                (Math.random() - 0.5) * 220
            );
            cloudGroup.add(cluster);
        }

        function animateClouds() {
            cloudGroup.children.forEach(cloud => {
                cloud.position.x += 0.025;
                if (dougGroup && cloud.position.x - dougGroup.position.x > 120) {
                    cloud.position.x = dougGroup.position.x - 120;
                    cloud.position.z = dougGroup.position.z + (Math.random() - 0.5) * 200;
                }
            });
        }

        // Dynamic Biome Color Mapping Function
        function getBlockColor(biomeType, h) {
            const biome = (biomeType || "").toLowerCase();

            if (biome.includes('river') || biome.includes('lake') || biome.includes('ocean') || biome.includes('wetland')) {
                if (h <= 1) return 0x0284c7; // Deep river water
                if (h === 2) return 0x38bdf8; // Shallow water
            }
            if (biome.includes('desert') || biome.includes('dune') || biome.includes('salt')) {
                return h > 3 ? 0xd97706 : 0xeab308; // Sandy yellow / dune shadow
            }
            if (biome.includes('snow') || biome.includes('glacier') || biome.includes('tundra')) {
                return h > 4 ? 0xe2e8f0 : 0xf8fafc; // Crisp white snow / ice
            }
            if (biome.includes('flower') || biome.includes('meadow')) {
                if (h <= 2) return 0x4ade80; // Bright green
            }
            if (h >= 4) {
                return 0x64748b; // Slate gray rock
            }
            if (h === 3) {
                return 0x15803d; // Dark forest green
            }
            return 0x38a169; // Default lush forest green
        }

        // --- WORLD & CHUNK STREAMING STATE ---
        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        const loadedChunks = new Map();
        const activeChunkMeshes = new Map();
        const activeSpecimens = [];
        let score = 0;
        let currentChunk = [999, 999];

        // Biome helper generator for procedural fallback
        function getProceduralBiome(cx, cz) {
            const biomes = ["lush_riverbank", "snowy_mountain", "desert_dunes", "slate_ridge", "flower_meadow"];
            const index = Math.abs((cx * 73 + cz * 37)) % biomes.length;
            return biomes[index];
        }

        async function fetchChunk(cx, cz) {
            const key = `${cx},${cz}`;
            if (loadedChunks.has(key)) return loadedChunks.get(key);

            try {
                const response = await fetch(`chunks/chunk_${cx}_${cz}.json`);
                if (!response.ok) throw new Error("Chunk file not found");
                const data = await response.json();
                loadedChunks.set(key, data);
                return data;
            } catch (err) {
                // Generates rich procedural terrain if dynamic JSON files are absent
                const biomeType = getProceduralBiome(cx, cz);
                const grid = [];

                for (let z = 0; z < 16; z++) {
                    const row = [];
                    for (let x = 0; x < 16; x++) {
                        const worldX = cx * 16 + (x - 7.5);
                        const worldZ = cz * 16 + (z - 7.5);
                        let n = pseudoNoise(worldX, worldZ);

                        let h = Math.max(1, Math.floor(n + 2.5));
                        if (biomeType === "snowy_mountain") h += 2;
                        if (biomeType === "lush_riverbank" && h < 2) h = 1; // Water level
                        row.push(h);
                    }
                    grid.push(row);
                }

                // Generates random specimens for exploration
                const specimenNames = [
                    "Caddisfly Larva", "Mayfly Nymph", "Stonefly Specimen",
                    "Water Penny Beetle", "Dobsonfly Nymph", "Blue-winged Olive",
                    "Solar Node Sensor", "Dragonfly Adult", "Emerald Beetle"
                ];

                const specimens = [];
                const specCount = Math.floor(Math.random() * 3) + 1;
                for (let i = 0; i < specCount; i++) {
                    specimens.push({
                        x: (Math.random() * 12 - 6),
                        y: (Math.random() * 12 - 6),
                        name: specimenNames[Math.floor(Math.random() * specimenNames.length)],
                        points: 1
                    });
                }

                const fallback = {
                    biome_type: biomeType,
                    elevation_grid: grid,
                    specimens: specimens
                };
                loadedChunks.set(key, fallback);
                return fallback;
            }
        }

        function getTerrainHeight(worldX, worldZ) {
            const cx = Math.floor((worldX + 8) / 16);
            const cz = Math.floor((worldZ + 8) / 16);
            const key = `${cx},${cz}`;

            const chunkData = loadedChunks.get(key);
            if (!chunkData || !chunkData.elevation_grid) return 0;

            const localX = Math.round(worldX - (cx * 16) + 7.5);
            const localZ = Math.round(worldZ - (cz * 16) + 7.5);

            if (localZ >= 0 && localZ < 16 && localX >= 0 && localX < 16) {
                const grid = chunkData.elevation_grid;
                if (grid[localZ] && grid[localZ][localX] !== undefined) {
                    return grid[localZ][localX];
                }
            }
            return 0;
        }

        // Tree Builder Helper
        function createVoxelTree(x, y, z, biomeType) {
            const treeGroup = new THREE.Group();
            treeGroup.position.set(x, y, z);

            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x78350f });
            const leafColor = biomeType === "snowy_mountain" ? 0xe2e8f0 : (biomeType === "desert_dunes" ? 0x059669 : 0x15803d);
            const leafMat = new THREE.MeshLambertMaterial({ color: leafColor });

            // Trunk
            const height = Math.floor(Math.random() * 2) + 3;
            for (let i = 0; i < height; i++) {
                const trunk = new THREE.Mesh(boxGeo, trunkMat);
                trunk.scale.set(0.5, 1, 0.5);
                trunk.position.set(0, i + 0.5, 0);
                trunk.castShadow = true;
                treeGroup.add(trunk);
            }

            // Leaves Top
            for (let lx = -1; lx <= 1; lx++) {
                for (let lz = -1; lz <= 1; lz++) {
                    for (let ly = 0; ly < 2; ly++) {
                        if (Math.abs(lx) === 1 && Math.abs(lz) === 1 && ly === 1) continue;
                        const leaf = new THREE.Mesh(boxGeo, leafMat);
                        leaf.position.set(lx * 0.8, height + ly + 0.5, lz * 0.8);
                        leaf.scale.set(0.9, 0.9, 0.9);
                        leaf.castShadow = true;
                        treeGroup.add(leaf);
                    }
                }
            }
            return treeGroup;
        }

        function renderChunk(cx, cz, chunkData) {
            const key = `${cx},${cz}`;
            if (activeChunkMeshes.has(key)) return;

            const chunkGroup = new THREE.Group();
            chunkGroup.position.set(cx * 16, 0, cz * 16);

            const grid = chunkData.elevation_grid || Array(16).fill().map(() => Array(16).fill(1));
            const biomeType = chunkData.biome_type || "forest";

            for (let x = 0; x < 16; x++) {
                for (let z = 0; z < 16; z++) {
                    const h = grid[z] && grid[z][x] !== undefined ? grid[z][x] : 1;
                    const colorHex = getBlockColor(biomeType, h);
                    const mat = new THREE.MeshLambertMaterial({ color: colorHex });

                    // Solid column loop (y=0 down to h) closes mountain gaps
                    for (let y = 0; y <= h; y++) {
                        const cube = new THREE.Mesh(boxGeo, mat);
                        cube.position.set(x - 7.5, y, z - 7.5);
                        cube.receiveShadow = true;
                        if (y === h) cube.castShadow = true;
                        chunkGroup.add(cube);
                    }

                    // Random Tree Spawning on elevated green ground
                    if (h >= 2 && h <= 3 && Math.random() < 0.035 && !biomeType.includes('river')) {
                        const tree = createVoxelTree(x - 7.5, h + 0.5, z - 7.5, biomeType);
                        chunkGroup.add(tree);
                    }
                }
            }

            // Spawn Specimens
            if (chunkData.specimens && Array.isArray(chunkData.specimens)) {
                const specimenGeo = new THREE.OctahedronGeometry(0.35);
                const specimenMat = new THREE.MeshStandardMaterial({ 
                    color: 0x38bdf8, 
                    emissive: 0x0284c7, 
                    emissiveIntensity: 0.6,
                    roughness: 0.1,
                    metalness: 0.2
                });

                chunkData.specimens.forEach(spec => {
                    const specimenMesh = new THREE.Mesh(specimenGeo, specimenMat);
                    const sx = spec.x !== undefined ? spec.x : 0;
                    const sz = spec.y !== undefined ? spec.y : 0;

                    const groundH = getTerrainHeight((cx * 16) + sx, (cz * 16) + sz);
                    const sy = groundH + 0.9;

                    specimenMesh.position.set(sx, sy, sz);
                    specimenMesh.castShadow = true;
                    specimenMesh.userData = {
                        name: spec.name || "Wild Specimen",
                        collected: false,
                        chunkKey: key,
                        baseY: sy
                    };
                    chunkGroup.add(specimenMesh);
                    activeSpecimens.push(specimenMesh);
                });
            }

            worldGroup.add(chunkGroup);
            activeChunkMeshes.set(key, chunkGroup);
        }

        // --- ENHANCED VOXEL LITTLE DOUG CHARACTER ---
        const dougGroup = new THREE.Group();

        // Torso
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0x15803d });
        const body = new THREE.Mesh(boxGeo, bodyMat);
        body.scale.set(0.7, 0.8, 0.5);
        body.position.y = 0.6;
        body.castShadow = true;
        dougGroup.add(body);

        // Head
        const headMat = new THREE.MeshLambertMaterial({ color: 0xfde047 });
        const head = new THREE.Mesh(boxGeo, headMat);
        head.scale.set(0.5, 0.5, 0.5);
        head.position.y = 1.25;
        head.castShadow = true;
        dougGroup.add(head);

        // Eyes
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });
        const leftEye = new THREE.Mesh(boxGeo, eyeMat);
        leftEye.scale.set(0.08, 0.1, 0.05);
        leftEye.position.set(-0.12, 1.3, 0.26);
        dougGroup.add(leftEye);

        const rightEye = leftEye.clone();
        rightEye.position.x = 0.12;
        dougGroup.add(rightEye);

        // Explorer Hat
        const hatMat = new THREE.MeshLambertMaterial({ color: 0x166534 });
        const hatCrown = new THREE.Mesh(boxGeo, hatMat);
        hatCrown.scale.set(0.55, 0.2, 0.55);
        hatCrown.position.y = 1.6;
        hatCrown.castShadow = true;
        dougGroup.add(hatCrown);

        const hatBrim = new THREE.Mesh(boxGeo, hatMat);
        hatBrim.scale.set(0.85, 0.05, 0.85);
        hatBrim.position.y = 1.5;
        hatBrim.castShadow = true;
        dougGroup.add(hatBrim);

        // Arms
        const armMat = new THREE.MeshLambertMaterial({ color: 0x166534 });
        const leftArm = new THREE.Mesh(boxGeo, armMat);
        leftArm.scale.set(0.2, 0.6, 0.2);
        leftArm.position.set(-0.48, 0.6, 0);
        leftArm.castShadow = true;
        dougGroup.add(leftArm);

        const rightArm = leftArm.clone();
        rightArm.position.x = 0.48;
        dougGroup.add(rightArm);

        // Legs
        const legMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
        const leftLeg = new THREE.Mesh(boxGeo, legMat);
        leftLeg.scale.set(0.22, 0.45, 0.22);
        leftLeg.position.set(-0.2, 0.225, 0);
        leftLeg.castShadow = true;
        dougGroup.add(leftLeg);

        const rightLeg = leftLeg.clone();
        rightLeg.position.x = 0.2;
        dougGroup.add(rightLeg);

        scene.add(dougGroup);

        // Player Movement Controls State
        const moveState = { up: false, down: false, left: false, right: false };

        const handleKey = (code, isDown) => {
            switch(code) {
                case 'KeyW': case 'ArrowUp': moveState.up = isDown; break;
                case 'KeyS': case 'ArrowDown': moveState.down = isDown; break;
                case 'KeyA': case 'ArrowLeft': moveState.left = isDown; break;
                case 'KeyD': case 'ArrowRight': moveState.right = isDown; break;
            }
        };

        window.addEventListener('keydown', (e) => handleKey(e.code, true));
        window.addEventListener('keyup', (e) => handleKey(e.code, false));

        const bindDPad = (id, key) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const start = (e) => { e.preventDefault(); moveState[key] = true; container.focus(); };
            const end = (e) => { e.preventDefault(); moveState[key] = false; };
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        };
        bindDPad('btn-up', 'up');
        bindDPad('btn-down', 'down');
        bindDPad('btn-left', 'left');
        bindDPad('btn-right', 'right');

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2200);
        }

        let walkCycleTime = 0;

        // --- GAME UPDATE LOOP ---
        async function updatePlayer() {
            const speed = 0.14;
            let moveX = 0;
            let moveZ = 0;

            if (moveState.up) moveZ -= speed;
            if (moveState.down) moveZ += speed;
            if (moveState.left) moveX -= speed;
            if (moveState.right) moveX += speed;

            const isMoving = (moveX !== 0 || moveZ !== 0);

            if (isMoving) {
                // Normalize diagonal movement speed
                if (moveX !== 0 && moveZ !== 0) {
                    moveX *= 0.7071;
                    moveZ *= 0.7071;
                }

                // Store previous position for smooth camera tracking delta
                const prevPosX = dougGroup.position.x;
                const prevPosZ = dougGroup.position.z;

                dougGroup.position.x += moveX;
                dougGroup.position.z += moveZ;

                // Smooth Rotation towards movement direction
                const targetAngle = Math.atan2(moveX, moveZ);
                dougGroup.rotation.y = targetAngle;

                // Move camera alongside player position maintaining controls target offset
                const deltaX = dougGroup.position.x - prevPosX;
                const deltaZ = dougGroup.position.z - prevPosZ;
                camera.position.x += deltaX;
                camera.position.z += deltaZ;

                // Leg & Arm Walk Animation Physics
                walkCycleTime += 0.25;
                leftLeg.rotation.x = Math.sin(walkCycleTime) * 0.6;
                rightLeg.rotation.x = -Math.sin(walkCycleTime) * 0.6;
                leftArm.rotation.x = -Math.sin(walkCycleTime) * 0.6;
                rightArm.rotation.x = Math.sin(walkCycleTime) * 0.6;
            } else {
                // Reset limb rotations when idle
                leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, 0.2);
                rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, 0.2);
                leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0, 0.2);
                rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0, 0.2);
            }

            const groundHeight = getTerrainHeight(dougGroup.position.x, dougGroup.position.z);
            const walkBounce = isMoving ? Math.abs(Math.sin(walkCycleTime)) * 0.12 : 0;
            dougGroup.position.y = groundHeight + walkBounce;

            // Camera Target Follows Character Height & Position
            controls.target.set(dougGroup.position.x, groundHeight + 1.0, dougGroup.position.z);

            // Dynamic Chunk Loading Check
            const cx = Math.floor((dougGroup.position.x + 8) / 16);
            const cz = Math.floor((dougGroup.position.z + 8) / 16);

            if (cx !== currentChunk[0] || cz !== currentChunk[1]) {
                currentChunk = [cx, cz];
                document.getElementById('chunk-coord').innerText = `[${cx}, ${cz}]`;

                for (let dx = -1; dx <= 1; dx++) {
                    for (let dz = -1; dz <= 1; dz++) {
                        const targetCx = cx + dx;
                        const targetCz = cz + dz;
                        const chunkData = await fetchChunk(targetCx, targetCz);
                        renderChunk(targetCx, targetCz, chunkData);

                        if (dx === 0 && dz === 0 && chunkData) {
                            const formattedBiome = chunkData.biome_type
                                ? chunkData.biome_type.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())
                                : "Outdoor Biome";
                            document.getElementById('biome-name').innerText = formattedBiome;
                        }
                    }
                }
            }

            // Specimen collection & Floating animation loop
            const time = Date.now() * 0.003;
            activeSpecimens.forEach(spec => {
                if (!spec.userData.collected) {
                    spec.rotation.y += 0.04;
                    spec.position.y = spec.userData.baseY + Math.sin(time + spec.position.x) * 0.15;

                    const worldPos = new THREE.Vector3();
                    spec.getWorldPosition(worldPos);

                    const dist = dougGroup.position.distanceTo(worldPos);
                    if (dist < 1.1) {
                        spec.userData.collected = true;
                        spec.parent.remove(spec);
                        score++;
                        document.getElementById('score').innerText = score;
                        showToast(`✨ Collected: ${spec.userData.name}`);
                    }
                }
            });
        }

        // --- ANIMATION RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            updatePlayer();
            animateClouds();
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Responsive Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
